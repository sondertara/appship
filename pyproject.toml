[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "appship"
version = "0.1.0"
description = "User-level AppImage / deb application manager with upstream update checks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sondertara" }]
keywords = ["appimage", "deb", "pacman", "updater", "linux"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Software Distribution",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Optional: better PEP 440 comparison. The fallback parser works without it.
versions = ["packaging>=23"]

[project.scripts]
appship = "appship.cli:main"

[project.urls]
Homepage = "https://github.com/sondertara/appship"
Repository = "https://github.com/sondertara/appship"
Issues = "https://github.com/sondertara/appship/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/appship"]

[tool.hatch.build.targets.sdist]
include = [
  "src/appship",
  "tests",
  "scripts",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = ["E501"]
