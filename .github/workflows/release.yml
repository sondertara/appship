name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run pytest
      - run: ./scripts/build.sh
      - run: cp scripts/install.sh dist/install.sh
      - run: cd dist && sha256sum appship.pyz ./*.whl ./*.tar.gz install.sh > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/appship.pyz
            dist/appship-*.whl
            dist/appship-*.tar.gz
            dist/install.sh
            dist/SHA256SUMS
